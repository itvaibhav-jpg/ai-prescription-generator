<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScript AI - Enterprise Prescription Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 MediScript AI</h1>
            <p>Enterprise-Grade AI-Powered Prescription Generator</p>
        </div>

        <div class="main-card">
            <div class="card-header">
                <h2>Generate Medical Prescription <span class="ai-badge">AI POWERED</span></h2>
            </div>

            <div class="card-body">
                <form id="prescriptionForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="patientName">Patient Name *</label>
                            <input type="text" id="patientName" required placeholder="Enter patient's full name">
                        </div>

                        <div class="form-group">
                            <label for="patientAge">Age *</label>
                            <input type="number" id="patientAge" required placeholder="Enter age" min="1" max="150">
                        </div>

                        <div class="form-group">
                            <label for="patientGender">Gender *</label>
                            <select id="patientGender" required>
                                <option value="">Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="patientWeight">Weight (kg)</label>
                            <input type="number" id="patientWeight" placeholder="Enter weight" min="1" step="0.1">
                        </div>

                        <div class="form-group">
                            <label for="doctorName">Doctor Name *</label>
                            <input type="text" id="doctorName" required placeholder="Dr. Name">
                        </div>

                        <div class="form-group">
                            <label for="doctorSpecialization">Specialization *</label>
                            <input type="text" id="doctorSpecialization" required placeholder="e.g., General Physician">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="symptoms">Symptoms & Diagnosis *</label>
                        <textarea id="symptoms" required placeholder="Describe patient's symptoms, diagnosis, and medical history..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="allergies">Known Allergies</label>
                        <input type="text" id="allergies" placeholder="List any known allergies (optional)">
                    </div>

                    <div class="form-group">
                        <label for="currentMedications">Current Medications</label>
                        <textarea id="currentMedications" placeholder="List any medications currently being taken (optional)"></textarea>
                    </div>

                    <div class="btn-container">
                        <button type="submit" class="btn" id="generateBtn">
                            🤖 Generate AI Prescription
                        </button>
                    </div>
                </form>

                <div id="loadingSection" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>AI is analyzing patient data and generating prescription...</p>
                </div>

                <div id="resultSection" class="result-section">
                    <h2>Generated Prescription</h2>
                    <div id="prescriptionOutput" class="prescription-output"></div>
                    
                    <div class="action-buttons">
                        <button class="btn" onclick="downloadPrescription()">📥 Download PDF</button>
                        <button class="btn btn-secondary" onclick="printPrescription()">🖨️ Print</button>
                        <button class="btn btn-secondary" onclick="resetForm()">🔄 New Prescription</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
